<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advanced CDPR Simulator</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #16191d; --panel2: #1d2126; --line: #2a2f36; 
    --text: #e6e9ec; --muted: #8b939c; --accent: #4fb0ff; --accent2: #ff8a4f;
  }
  [data-theme="light"] {
    --bg: #f0f2f5; --panel: #ffffff; --panel2: #f8f9fa; --line: #dee2e6; 
    --text: #212529; --muted: #6c757d; --accent: #0d6efd;
  }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #canvas-wrap { position:absolute; inset:0; }
  
  .ui-panel {
    position:absolute; background:var(--panel); border:1px solid var(--line); 
    border-radius:10px; padding:14px 16px 18px; backdrop-filter:blur(6px); 
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  #hud { top:16px; left:16px; width:240px; }
  #pillar-hud { top:16px; right:16px; width:200px; display:none; }
  
  h1 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; font-weight:600; }
  .row { margin-bottom:14px; }
  .row:last-child { margin-bottom:0; }
  .row label { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .row label b { color:var(--text); font-family:monospace; font-weight:500; }
  
  input[type=range] { -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:var(--line); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); cursor:pointer; }
  
  #top-bar { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:8px 16px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold; }
  button:hover { background:var(--line); }
  
  #hint { position:absolute; bottom:16px; left:16px; font-size:11px; color:var(--muted); background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:6px; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="hud" class="ui-panel">
  <h1>End-Effector Pos</h1>
  <div class="row"><label>X <b id="vx">0.00</b></label><input type="range" id="sx" min="-2.0" max="2.0" step="0.01" value="0"></div>
  <div class="row"><label>Y <b id="vy">2.50</b></label><input type="range" id="sy" min="0.5" max="6.0" step="0.01" value="2.5"></div>
  <div class="row"><label>Z <b id="vz">0.00</b></label><input type="range" id="sz" min="-2.0" max="2.0" step="0.01" value="0"></div>
</div>

<div id="pillar-hud" class="ui-panel">
  <h1>Edit Pillar <span id="p-id"></span></h1>
  <div class="row">
    <label>Height <b id="vh">5.00</b></label>
    <input type="range" id="sh" min="3.0" max="8.0" step="0.1" value="5.0">
  </div>
  <button id="close-pillar" style="width:100%; margin-top:10px;">Close</button>
</div>

<div id="top-bar">
  <button id="btn-theme">Toggle Theme</button>
</div>
<div id="hint">Drag cube to move · Click pillars to resize</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

<script>
(function(){
  // --- SCENE SETUP ---
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f12);
  scene.fog = new THREE.Fog(0x0d0f12, 12, 30);
  
  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(6, 5, 7);
  
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  wrap.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 2, 0);

  // --- LIGHTS & ENVIRONMENT ---
  const ambient = new THREE.AmbientLight(0x8899aa, 0.5); scene.add(ambient);
  const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(5, 10, 4); key.castShadow = true; scene.add(key);
  
  const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshStandardMaterial({color:0x14171b, roughness:0.95}));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
  
  let grid = new THREE.GridHelper(14, 28, 0x2a2f36, 0x1f2328); grid.position.y = 0.01; scene.add(grid);

  // --- MATERIALS & PARAMS ---
  const HALF = 2.2; const CUBE_SIZE = 0.6;
  const steelMat = new THREE.MeshStandardMaterial({color:0x555b63, roughness:0.35, metalness:0.85});
  const darkMat = new THREE.MeshStandardMaterial({color:0x2b2f34, roughness:0.5});
  const pulleyMat= new THREE.MeshStandardMaterial({color:0x8a8f96, roughness:0.25, metalness:0.9});
  const cableMat = new THREE.MeshStandardMaterial({color:0x111214, roughness:0.5});
  
  const corners = [
    new THREE.Vector3( HALF, 0,  HALF), new THREE.Vector3( HALF, 0, -HALF),
    new THREE.Vector3(-HALF, 0, -HALF), new THREE.Vector3(-HALF, 0,  HALF)
  ];
  
  // --- PILLAR GENERATION ---
  const pillarsData = [];
  const pulleyPoints = [];
  
  corners.forEach((c, idx) => {
    const group = new THREE.Group(); group.position.set(c.x, 0, c.z); scene.add(group);
    
    // Base parts
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.5,16), darkMat); motor.position.y = 0.37; group.add(motor);
    
    // Variable height parts
    const currentH = 5.0;
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,12), steelMat);
    pillar.position.y = 0.37; pillar.userData = { isPillar: true, index: idx };
    group.add(pillar);
    
    const bracketGroup = new THREE.Group(); group.add(bracketGroup);
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.18,0.3), darkMat); bracket.castShadow = true; bracketGroup.add(bracket);
    const pulley = new THREE.Mesh(new THREE.TorusGeometry(0.14,0.045,10,20), pulleyMat);
    pulley.rotation.y = Math.atan2(-c.z, -c.x) + Math.PI/2; pulley.castShadow = true; bracketGroup.add(pulley);
    
    const vCable = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,1,6), cableMat); group.add(vCable);

    pillarsData.push({ group, pillar, bracketGroup, vCable, basex: c.x, basez: c.z });
    pulleyPoints.push(new THREE.Vector3());
  });

  function setPillarHeight(idx, h) {
    const p = pillarsData[idx];
    p.pillar.scale.set(1, h, 1);
    p.pillar.position.y = 0.37 + h/2;
    p.bracketGroup.position.set(0, 0.37 + h, 0);
    p.vCable.scale.set(1, h, 1);
    p.vCable.position.set(0, 0.37 + h/2, 0);
    pulleyPoints[idx].set(p.basex, 0.37 + h, p.basez);
    updateCube(cube.position.x, cube.position.y, cube.position.z);
  }

  // --- CUBE & CABLES ---
  const cube = new THREE.Mesh(new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE), new THREE.MeshStandardMaterial({color:0xff8a4f}));
  cube.castShadow = true; scene.add(cube);
  
  const cubeCornerOffsets = [
    new THREE.Vector3(CUBE_SIZE/2, CUBE_SIZE/2, CUBE_SIZE/2), new THREE.Vector3(CUBE_SIZE/2, CUBE_SIZE/2, -CUBE_SIZE/2),
    new THREE.Vector3(-CUBE_SIZE/2, CUBE_SIZE/2, -CUBE_SIZE/2), new THREE.Vector3(-CUBE_SIZE/2, CUBE_SIZE/2, CUBE_SIZE/2)
  ];
  const cables = corners.map(() => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 6), cableMat); scene.add(m); return m; });

  function updateCube(x, y, z) {
    cube.position.set(x, y, z);
    const worldCorner = new THREE.Vector3();
    for (let i=0; i<4; i++) {
      worldCorner.copy(cubeCornerOffsets[i]).add(cube.position);
      const pt = pulleyPoints[i];
      cables[i].position.copy(pt).add(worldCorner).multiplyScalar(0.5);
      cables[i].scale.set(1, Math.max(pt.distanceTo(worldCorner), 0.001), 1);
      cables[i].lookAt(pt); cables[i].rotateX(Math.PI/2);
    }
    // Sync HUD
    sx.value = x; sy.value = y; sz.value = z;
    vx.textContent = x.toFixed(2); vy.textContent = y.toFixed(2); vz.textContent = z.toFixed(2);
  }

  // Initialize
  pillarsData.forEach((_, i) => setPillarHeight(i, 5.0));

  // --- TRANSFORM CONTROLS (Free moving cube) ---
  const tControls = new THREE.TransformControls(camera, renderer.domElement);
  tControls.attach(cube); scene.add(tControls);
  
  tControls.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);
  tControls.addEventListener('change', () => {
    updateCube(cube.position.x, cube.position.y, cube.position.z);
  });

  // --- UI WIRING ---
  const sx = document.getElementById('sx'), sy = document.getElementById('sy'), sz = document.getElementById('sz');
  const vx = document.getElementById('vx'), vy = document.getElementById('vy'), vz = document.getElementById('vz');
  const onSlide = () => updateCube(parseFloat(sx.value), parseFloat(sy.value), parseFloat(sz.value));
  [sx,sy,sz].forEach(el => el.addEventListener('input', onSlide));

  // --- RAYCASTING (Clicking Pillars) ---
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let activePillarIndex = -1;
  const pillarHud = document.getElementById('pillar-hud'), pId = document.getElementById('p-id');
  const sh = document.getElementById('sh'), vh = document.getElementById('vh');

  window.addEventListener('click', (e) => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);
    
    const hit = intersects.find(x => x.object.userData.isPillar);
    if(hit) {
      activePillarIndex = hit.object.userData.index;
      pillarHud.style.display = 'block';
      pId.innerText = (activePillarIndex + 1);
      const currentHeight = pillarsData[activePillarIndex].pillar.scale.y;
      sh.value = currentHeight; vh.innerText = currentHeight.toFixed(2);
    }
  });

  sh.addEventListener('input', () => {
    if(activePillarIndex > -1) {
      const val = parseFloat(sh.value);
      vh.innerText = val.toFixed(2);
      setPillarHeight(activePillarIndex, val);
    }
  });
  document.getElementById('close-pillar').addEventListener('click', () => pillarHud.style.display = 'none');

  // --- THEME TOGGLE ---
  let isDark = true;
  document.getElementById('btn-theme').addEventListener('click', () => {
    isDark = !isDark;
    document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
    
    const bgCol = isDark ? 0x0d0f12 : 0xf0f2f5;
    scene.background.setHex(bgCol);
    scene.fog.color.setHex(bgCol);
    ground.material.color.setHex(isDark ? 0x14171b : 0xe2e8f0);
    
    scene.remove(grid);
    grid = new THREE.GridHelper(14, 28, isDark ? 0x2a2f36 : 0xadb5bd, isDark ? 0x1f2328 : 0xdee2e6);
    grid.position.y = 0.01; scene.add(grid);
  });

  window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
})();
</script>
</body>
</html>
